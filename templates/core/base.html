{% load static %}
<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{% block title %}UniBus - Suivi Transport{% endblock %}</title>

    <!-- ============================================
         PWA - META TAGS
    ============================================ -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="UniBus">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="UniBus">

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192x192.png' %}">
    <link rel="apple-touch-icon" sizes="152x152" href="{% static 'icons/icon-152x152.png' %}">
    <link rel="apple-touch-icon" sizes="167x167" href="{% static 'icons/icon-152x152.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'icons/icon-192x192.png' %}">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/icon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'icons/icon-16x16.png' %}">

    <!-- TailwindCSS + DaisyUI CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet">

    <!-- Alpine.js & Font Awesome -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }

        /* Espace pour la bottom nav fixe + safe area iPhone */
        .pb-safe {
            padding-bottom: calc(5rem + env(safe-area-inset-bottom));
        }

        .bottom-nav-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Animations */
        @keyframes slide-up {
            from { transform: translateY(20px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        .slide-up {
            animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Style des items de la bottom nav */
        .nav-item {
            color: #94a3b8; /* slate-400 */
            transition: color .2s ease, transform .1s ease;
        }
        .nav-item:hover {
            color: #e2e8f0; /* slate-200 */
        }
        .nav-item:active {
            transform: scale(0.95);
        }
        .nav-item.active {
            color: #818cf8 !important; /* indigo-400 */
            font-weight: 700;
        }
        .nav-item.active-accent {
            color: #fbbf24 !important; /* amber-400 */
            font-weight: 700;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body class="antialiased min-h-screen">

    <!-- Indicateur hors-ligne -->
    <div id="offlineIndicator" class="hidden fixed top-0 left-0 right-0 bg-amber-500 text-white text-center text-xs font-semibold py-1.5 z-[9999]">
        <i class="fa-solid fa-wifi-slash mr-1"></i> Mode hors-ligne
    </div>

    <!-- ============================================
         CONTENU PRINCIPAL
    ============================================ -->
    <main class="px-4 pt-3 pb-safe max-w-md mx-auto w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- ============================================
         TAB BAR — BOTTOM NAVIGATION
    ============================================ -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 z-50 bottom-nav-safe shadow-2xl">
        <div class="max-w-md mx-auto flex justify-around items-center h-16 px-1">

            <!-- Tab 1 : Accueil / Dashboard -->
            <a href="/dashboard/"
               class="nav-item {% if request.path == '/dashboard/' %}active{% endif %} flex flex-col items-center justify-center flex-1 h-full gap-1">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] tracking-tight">Accueil</span>
            </a>

            <!-- Tab 2 : Liste des bus -->
            <a href="/"
               class="nav-item {% if request.path == '/' %}active{% endif %} flex flex-col items-center justify-center flex-1 h-full gap-1">
                <i class="fa-solid fa-bus-simple text-lg"></i>
                <span class="text-[10px] tracking-tight">Bus</span>
            </a>

            <!-- Tab 3 : Carte interactive -->
            <a href="#"
               class="nav-item {% if '/student/map/' in request.path %}active{% endif %} flex flex-col items-center justify-center flex-1 h-full gap-1">
                <i class="fa-solid fa-map-location-dot text-lg"></i>
                <span class="text-[10px] tracking-tight">Carte</span>
            </a>

            <!-- Tab 4 : Horaires (accent ambre) -->
            <a href="#"
               class="nav-item {% if request.path == '/schedules/' %}active-accent{% endif %} flex flex-col items-center justify-center flex-1 h-full gap-1 hover:text-amber-400">
                <i class="fa-regular fa-clock text-lg"></i>
                <span class="text-[10px] tracking-tight">Horaires</span>
            </a>

            <!-- Tab 5 : Profil -->
            <a href="#"
               class="nav-item {% if request.path == '/profile/' %}active{% endif %} flex flex-col items-center justify-center flex-1 h-full gap-1">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[10px] tracking-tight">Profil</span>
            </a>

        </div>
    </nav>

    <!-- Toast container -->
    <div id="toast-container" class="fixed top-4 right-4 left-4 sm:left-auto sm:w-80 z-[9999] space-y-2 pointer-events-none"></div>

    <!-- ============================================
         SCRIPTS
    ============================================ -->
    <script>
        /* ============================================
           SERVICE WORKER
        ============================================ */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker
                    .register('/sw.js', { scope: '/' })
                    .then((registration) => {
                        console.log('✅ Service Worker enregistré :', registration.scope);
                    })
                    .catch((error) => {
                        console.error('❌ Erreur Service Worker :', error);
                    });
            });

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }

        /* ============================================
           DÉTECTION ONLINE / OFFLINE
        ============================================ */
        window.addEventListener('online', () => {
            document.getElementById('offlineIndicator')?.classList.add('hidden');
            showToast('📡 Connexion rétablie', 'success');
        });

        window.addEventListener('offline', () => {
            document.getElementById('offlineIndicator')?.classList.remove('hidden');
            showToast('⚠️ Mode hors-ligne', 'warning');
        });

        /* ============================================
           TOAST SYSTEM
        ============================================ */
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const colors = {
                success: 'bg-emerald-600 text-white shadow-emerald-200',
                error:   'bg-rose-600 text-white shadow-rose-200',
                warning: 'bg-amber-500 text-white shadow-amber-200',
                info:    'bg-indigo-600 text-white shadow-indigo-200'
            };

            const icons = {
                success: 'fa-circle-check',
                error:   'fa-circle-xmark',
                warning: 'fa-triangle-exclamation',
                info:    'fa-circle-info'
            };

            const toast = document.createElement('div');
            toast.className = `${colors[type]} px-5 py-3.5 rounded-2xl shadow-lg slide-up flex items-center gap-3 text-xs font-semibold pointer-events-auto border border-white/10`;
            toast.innerHTML = `
                <i class="fa-solid ${icons[type]} text-base"></i>
                <span class="flex-1">${message}</span>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.transition = 'opacity .3s, transform .3s';
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
