<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
     
  <!-- ============================================
  PWA - META TAGS
  ============================================ -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UniBus">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="UniBus">
  
  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="/static/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/static/icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/static/icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/icon-192x192.png">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/icon-16x16.png">
  
  <!-- ============================================
  SERVICE WORKER
  ============================================ -->
  <script>
    // Enregistrement du Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/static/sw.js')
          .then((registration) => {
            console.log('✅ Service Worker enregistré avec succès:', registration);
          })
          .catch((error) => {
            console.error('❌ Erreur d\'enregistrement du Service Worker:', error);
          });
      });

      // Gestion des mises à jour
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }

    // Détecter le mode hors-ligne
    window.addEventListener('online', () => {
      document.getElementById('offlineIndicator')?.classList.add('hidden');
      showToast('📡', 'Connexion rétablie');
    });

    window.addEventListener('offline', () => {
      document.getElementById('offlineIndicator')?.classList.remove('hidden');
      showToast('⚠️', 'Mode hors-ligne');
    });
  </script>
    
    <title>{% block title %}UniBus - Suivi Transport{% endblock %}</title>
    
    <!-- TailwindCSS + DaisyUI CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet">
    
    <!-- Alpine.js & Font Awesome -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body {
            background-color: #f8fafc; /* Slate 50 */
            color: #0f172a; /* Slate 900 */
            -webkit-tap-highlight-color: transparent;
        }

        .pb-safe {
            padding-bottom: calc(4.2rem + env(safe-area-inset-bottom));
        }

        .bottom-nav-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Animations */
        @keyframes slide-up {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .slide-up {
            animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="antialiased min-h-screen flex flex-col justify-between">

<!-- CONTENU PRINCIPAL -->
<main x-data="app()" x-init="init()" class="flex-1 px-4 pt-3 pb-safe max-w-md mx-auto w-full">
    {% block content %}{% endblock %}
</main>

<!-- TAB BAR BOTTOM NAVIGATION (ARTOISE SOMBRE / ACCENT BLEU & AMBRE) -->
<nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 z-50 bottom-nav-safe shadow-2xl">
    <div class="max-w-md mx-auto flex justify-around items-center h-16 px-2">
        
        <!-- Tab 1: Liste des bus -->
        <a href="/" 
           class="flex flex-col items-center justify-center flex-1 h-full gap-1 transition-all active:scale-95
                  {% if request.path == '/student/' or request.path == '/student/list/' %} text-indigo-400 font-bold {% else %} text-slate-400 hover:text-slate-200 {% endif %}">
            <i class="fa-solid fa-bus-simple text-lg"></i>
            <span class="text-[11px] tracking-tight">Bus</span>
        </a>

        <!-- Tab 2: Carte interactive -->
        <a href="/" 
           class="flex flex-col items-center justify-center flex-1 h-full gap-1 transition-all active:scale-95
                  {% if '/student/map/' in request.path %} text-indigo-400 font-bold {% else %} text-slate-400 hover:text-slate-200 {% endif %}">
            <i class="fa-solid fa-map-location-dot text-lg"></i>
            <span class="text-[11px] tracking-tight">Carte</span>
        </a>Django>=4.2


        <!-- Tab 3: Horaires (Accent Orange/Ambre pour attirer la vue) -->
        <a href="#" 
           class="flex flex-col items-center justify-center flex-1 h-full gap-1 transition-all active:scale-95 text-slate-400 hover:text-amber-400">
            <i class="fa-regular fa-clock text-lg"></i>
            <span class="text-[11px] tracking-tight">Horaires</span>
        </a>



    </div>
</nav>

<!-- Toast System -->
<div id="toast-container" class="fixed top-4 right-4 left-4 sm:left-auto sm:w-80 z-[9999] space-y-2 pointer-events-none"></div>

<script>
    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const colors = {
            success: 'bg-emerald-600 text-white shadow-emerald-200',
            error: 'bg-rose-600 text-white shadow-rose-200',
            warning: 'bg-amber-500 text-white shadow-amber-200',
            info: 'bg-indigo-600 text-white shadow-indigo-200'
        };
        const toast = document.createElement('div');
        toast.className = `${colors[type]} px-5 py-3.5 rounded-2xl shadow-lg slide-up flex items-center gap-3 text-xs font-semibold pointer-events-auto border border-white/10`;
        toast.innerHTML = `<span class="flex-1">${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => { toast.remove(); }, 3200);
    }
    
    function app() {
        return {
            init() {}
        };
    }
</script>

{% block extra_js %}{% endblock %}
</body>
</html>
